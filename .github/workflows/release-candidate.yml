name: Build release candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Maven Central bundle
    if: ${{ github.actor == vars.CI_ALLOWED_ACTOR }}
    environment: maven-central
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "invalid release version: ${version}" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Build signed deployment bundle
        shell: bash
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          project_version=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$project_version" != "$VERSION" ]]; then
            echo "tag version ${VERSION} does not match project version ${project_version}" >&2
            exit 1
          fi
          mvn -B -Prelease verify
          mkdir -p candidate
          ./.github/scripts/create-central-bundle.sh "$VERSION" candidate/central-bundle.zip
          ./.github/scripts/verify-central-bundle.sh "$VERSION" candidate/central-bundle.zip
          (cd candidate && sha256sum -- central-bundle.zip > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ env.VERSION }}
          path: candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
